    #     # SSL Configuration
    #     ssl_certificate /etc/letsencrypt/live/n8n.yourdomain.com/fullchain.pem;  # CHANGE THIS
    #     ssl_certificate_key /etc/letsencrypt/live/n8n.yourdomain.com/privkey.pem;  # CHANGE THIS
    #     ssl_session_timeout 1d;
    #     ssl_session_cache shared:SSL:50m;
    #     ssl_session_tickets off;
    #
    #     # Modern SSL Configuration
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    #     ssl_prefer_server_ciphers off;
    #
    #     # HSTS (optional - uncomment if you're sure about HTTPS)
    #     # add_header Strict-Transport-Security "max-age=63072000" always;
    #
    #     # Security Headers
    #     add_header X-Frame-Options "SAMEORIGIN" always;
